version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 2
    groups:
      analytics-stack:
        patterns:
          - pandas
          - matplotlib

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 2
    groups:
      github-actions-runtime:
        patterns:
          - "*"
