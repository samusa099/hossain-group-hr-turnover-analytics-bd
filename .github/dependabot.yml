version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 2
    groups:
      analytics-stack:
        patterns:
          - pandas
          - matplotlib

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Dhaka
    open-pull-requests-limit: 5
    groups:
      codeql-version-suite:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
        update-types:
          - major
          - minor
          - patch

      codeql-security-suite:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"

      other-actions-patch-minor:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action/*"
        update-types:
          - minor
          - patch

    commit-message:
      prefix: actions
