name: Sync dataset and case study to Kaggle

on:
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "notebooks/Hossain_Group_Turnover_Analysis.ipynb"
      - "case-study/**"
      - "DATA_PROVENANCE.md"
      - "DATASET_USAGE_GUIDE.md"
      - "CITATION.cff"
      - "kaggle/**"
      - "scripts/prepare_kaggle_dataset.py"
      - "scripts/validate_project.py"
      - ".github/workflows/sync-kaggle.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "notebooks/Hossain_Group_Turnover_Analysis.ipynb"
      - "case-study/**"
      - "DATA_PROVENANCE.md"
      - "DATASET_USAGE_GUIDE.md"
      - "CITATION.cff"
      - "kaggle/**"
      - "scripts/prepare_kaggle_dataset.py"
      - "scripts/validate_project.py"
      - ".github/workflows/sync-kaggle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-package:
    name: Validate Kaggle upload package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate canonical project files
        run: python scripts/validate_project.py

      - name: Build and validate clean Kaggle package
        env:
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || 'dry-run-user' }}
        run: |
          python scripts/prepare_kaggle_dataset.py \
            --output .kaggle-build/dataset

      - name: Upload package preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaggle-dataset-and-case-package-preview
          path: .kaggle-build/dataset
          if-no-files-found: error
          retention-days: 3

  publish-dataset:
    name: Publish Kaggle dataset
    needs: validate-package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      DATASET_SLUG: hossain-group-hr-turnover-recovery-analytics

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify Kaggle configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "::error::Repository variable KAGGLE_USERNAME is missing."
            exit 1
          fi

          if [[ ! "$KAGGLE_USERNAME" =~ ^[a-z0-9_-]+$ ]]; then
            echo "::error::KAGGLE_USERNAME must be the exact lowercase Kaggle username."
            exit 1
          fi

          echo "Kaggle username is configured."

      - name: Install official Kaggle CLI
        run: |
          python -m pip install --disable-pip-version-check --no-input kaggle==2.2.4
          kaggle --version

      - name: Configure Kaggle credentials
        shell: bash
        env:
          KAGGLE_CREDENTIAL: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.kaggle"

          if [ -z "$KAGGLE_CREDENTIAL" ]; then
            echo "::error::Repository secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          username = os.environ["KAGGLE_USERNAME"]
          credential = os.environ["KAGGLE_CREDENTIAL"].strip()
          config_dir = Path.home() / ".kaggle"

          try:
              parsed = json.loads(credential)
          except json.JSONDecodeError:
              parsed = None

          if isinstance(parsed, dict):
              file_username = str(parsed.get("username", "")).strip()
              key = str(parsed.get("key", "")).strip()
              if not file_username or not key:
                  raise SystemExit(
                      "Legacy Kaggle credential JSON must contain non-empty username and key values."
                  )
              if file_username != username:
                  raise SystemExit(
                      "KAGGLE_USERNAME does not match the username in the legacy Kaggle credential."
                  )
              path = config_dir / "kaggle.json"
              path.write_text(
                  json.dumps({"username": file_username, "key": key}),
                  encoding="utf-8",
              )
              path.chmod(0o600)
              print("Configured legacy Kaggle API credentials.")
          else:
              path = config_dir / "access_token"
              path.write_text(credential, encoding="utf-8")
              path.chmod(0o600)
              print("Configured modern Kaggle API token.")
          PY

      - name: Validate project and build upload package
        run: |
          python scripts/validate_project.py
          python scripts/prepare_kaggle_dataset.py \
            --output .kaggle-build/dataset \
            --username "$KAGGLE_USERNAME"

      - name: Check whether the Kaggle dataset exists
        id: dataset
        shell: bash
        run: |
          set -euo pipefail

          target="$KAGGLE_USERNAME/$DATASET_SLUG"

          kaggle datasets list \
            --mine \
            --search "$DATASET_SLUG" \
            --csv \
            > /tmp/kaggle-owned-datasets.csv

          TARGET_DATASET="$target" python - <<'PY'
          import csv
          import os
          from pathlib import Path

          target = os.environ["TARGET_DATASET"]
          csv_path = Path("/tmp/kaggle-owned-datasets.csv")

          with csv_path.open("r", encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames or []
              if "ref" not in fieldnames:
                  raise SystemExit(
                      "Kaggle dataset listing did not contain the expected 'ref' column."
                  )
              references = {
                  str(row.get("ref", "")).strip()
                  for row in reader
                  if str(row.get("ref", "")).strip()
              }

          exists = target in references
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exists={'true' if exists else 'false'}\n")

          print(
              f"Kaggle dataset {'exists' if exists else 'does not exist'}: {target}"
          )
          PY

      - name: Create public Kaggle dataset
        if: steps.dataset.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          kaggle datasets create \
            --path .kaggle-build/dataset \
            --dir-mode zip \
            --public

      - name: Publish new Kaggle dataset version
        if: steps.dataset.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          kaggle datasets version \
            --path .kaggle-build/dataset \
            --dir-mode zip \
            --message "Automatic GitHub case-study sync from ${GITHUB_SHA::7}"

      - name: Print Kaggle dataset URL
        run: |
          echo "Dataset: https://www.kaggle.com/datasets/$KAGGLE_USERNAME/$DATASET_SLUG"

      - name: Remove Kaggle credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.kaggle/access_token" "$HOME/.kaggle/kaggle.json"
