name: Sync dataset and case study to Kaggle

on:
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "notebooks/Hossain_Group_Turnover_Analysis.ipynb"
      - "case-study/**"
      - "DATA_PROVENANCE.md"
      - "DATASET_USAGE_GUIDE.md"
      - "CITATION.cff"
      - "kaggle/**"
      - "scripts/prepare_kaggle_dataset.py"
      - ".github/workflows/sync-kaggle.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "notebooks/Hossain_Group_Turnover_Analysis.ipynb"
      - "case-study/**"
      - "DATA_PROVENANCE.md"
      - "DATASET_USAGE_GUIDE.md"
      - "CITATION.cff"
      - "kaggle/**"
      - "scripts/prepare_kaggle_dataset.py"
      - ".github/workflows/sync-kaggle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package:
    name: Validate Kaggle upload package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate canonical project files
        run: python scripts/validate_project.py

      - name: Build and validate clean Kaggle package
        env:
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME || 'dry-run-user' }}
        run: |
          python scripts/prepare_kaggle_dataset.py \
            --output .kaggle-build/dataset

      - name: Upload package preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaggle-dataset-and-case-package-preview
          path: .kaggle-build/dataset
          if-no-files-found: error
          retention-days: 3

  publish-dataset:
    name: Publish Kaggle dataset version
    needs: validate-package
    if: github.event_name != 'pull_request' && vars.KAGGLE_USERNAME != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET_SLUG: hossain-group-hr-turnover-analytics-bd

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify Kaggle configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "::error::Repository variable KAGGLE_USERNAME is missing."
            exit 1
          fi

          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Repository secret KAGGLE_API_TOKEN is missing."
            exit 1
          fi

          if [[ ! "$KAGGLE_USERNAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::KAGGLE_USERNAME contains unsupported characters."
            exit 1
          fi

          echo "Kaggle username is configured."
          echo "Kaggle API token is configured."

      - name: Install official Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle==2.2.3

      - name: Validate project and build upload package
        run: |
          python scripts/validate_project.py
          python scripts/prepare_kaggle_dataset.py \
            --output .kaggle-build/dataset \
            --username "$KAGGLE_USERNAME"

      - name: Check whether the Kaggle dataset exists
        id: dataset
        shell: bash
        run: |
          set +e
          kaggle datasets files \
            "$KAGGLE_USERNAME/$DATASET_SLUG" \
            --page-size 1 \
            > /tmp/kaggle-dataset-check.log 2>&1
          status=$?
          set -e

          cat /tmp/kaggle-dataset-check.log

          if [ "$status" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eiq "404|not found|does not exist" /tmp/kaggle-dataset-check.log; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unable to determine whether the Kaggle dataset exists."
            exit "$status"
          fi

      - name: Create public Kaggle dataset
        if: steps.dataset.outputs.exists == 'false'
        run: |
          kaggle datasets create \
            --path .kaggle-build/dataset \
            --dir-mode zip \
            --public

      - name: Publish new Kaggle dataset version
        if: steps.dataset.outputs.exists == 'true'
        run: |
          kaggle datasets version \
            --path .kaggle-build/dataset \
            --dir-mode zip \
            --message "Automatic GitHub case-study sync from ${GITHUB_SHA::7}"

      - name: Print Kaggle dataset URL
        run: |
          echo "Dataset: https://www.kaggle.com/datasets/$KAGGLE_USERNAME/$DATASET_SLUG"
