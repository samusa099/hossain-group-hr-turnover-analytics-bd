name: Safe logging regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-logging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-safe-validation-output:
    name: Verify privacy-safe validation output
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile validation code and tests
        run: python -m compileall -q scripts tests

      - name: Run privacy-safe logging regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
