name: Apply alert 1 remediation

on:
  push:
    branches: [alert-autofix-1]
    paths:
      - .github/workflows/apply-alert-1-remediation.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: alert-autofix-1
          fetch-depth: 0

      - name: Remove sensitive data from validation logs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/validate_project.py")
          text = path.read_text(encoding="utf-8")
          old = '    print(f"FAIL: {sanitize_for_log(message)}")\n'
          new = (
              '    # Caller-provided validation details may contain HR identifiers or secrets.\n'
              '    print("FAIL: project validation failed; review the validation category in code.")\n'
          )
          if text.count(old) != 1:
              raise SystemExit("Expected logging sink was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          rm .github/workflows/apply-alert-1-remediation.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate_project.py .github/workflows/apply-alert-1-remediation.yml
          git commit -m "Fix clear-text validation logging"
          git push origin HEAD:alert-autofix-1
