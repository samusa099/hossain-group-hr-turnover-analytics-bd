name: Repository Maintenance
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: repository-maintenance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package-labeler:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: write, issues: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - id: workspace
        shell: bash
        run: 'if [[ -f package.json || -f pnpm-workspace.yaml || -f lerna.json || -f yarn.lock ]]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi'
      - name: Pull Request Package Labeler
        if: steps.workspace.outputs.available == 'true'
        uses: csi-lk/package-labeler@f889015c33daa43c2b6d4c5aad5893a794f242af # v1.0.1
  todo-tracker:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with: {fetch-depth: 0}
      - name: Track TODO Action
        uses: ribtoks/tdg-github-action@7cc4b6643e790dde39ac8bf2cfc8c08c660afbb2 # v0.4.17-beta
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          LABEL: todo-comment
          EXTENDED_LABELS: true
          CLOSE_ON_SAME_BRANCH: true
          ADD_LIMIT: 10
          CLOSE_LIMIT: 10
          EXCLUDE_PATTERN: '(node_modules|vendor|dist|build|\.git)/'
      - name: Verify Changed files
        id: verify
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        with: {files: '**/*'}
      - if: steps.verify.outputs.files_changed == 'true'
        env: {CHANGED_FILES: '${{ steps.verify.outputs.changed_files }}'}
        run: 'echo "Unexpected uncommitted changes: $CHANGED_FILES"; exit 1'
