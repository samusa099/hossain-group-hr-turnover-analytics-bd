name: "Mokhles HR Analytics CodeQL Configuration"

queries:
  - uses: security-extended

paths:
  - src
  - scripts
  - tests
  - packages/kaggle/structured_workspace/12_SCRIPTS

paths-ignore:
  - "**/*.ipynb"
  - "**/*.csv"
  - "**/*.xlsx"
  - "**/*.xls"
  - "**/*.pbix"
  - "data/**"
  - "docs/**"
  - "reports/**"
